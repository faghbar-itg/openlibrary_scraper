[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openlibrary-search-scraper"
version = "0.1.0"
description = "Simple Open Library scraper using an authenticated proxy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.9",
    "requests>=2.32",
]

[tool.setuptools]
packages = ["config", "requests_apis", "processing"]
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py310"
